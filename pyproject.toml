[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aec-intelligence"
version = "0.1.0"
description = "Local-first AEC Semantic Design Intelligence prototype"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
cad = ["ezdxf>=1.3"]
bim = ["ifcopenshell>=0.8"]
gis = ["shapely>=2", "pyproj>=3", "geopandas>=0.14", "rasterio>=1.3"]
pdf = ["PyMuPDF>=1.24"]
semantic = ["rdflib>=7", "pyoxigraph>=0.5"]
parquet = ["pyarrow>=15"]
runtime = ["duckdb>=1", "neo4j>=5"]
dev = ["pytest>=8"]

[project.scripts]
aec = "aec_intelligence.cli:main"
aec-mcp = "aec_intelligence.mcp_stdio:main"
aec-mcp-http = "aec_intelligence.mcp_http:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aec_intelligence = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
