name: Ontology intelligence safety

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  intelligence-safety:
    name: intelligence-safety (py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,cad,bim,shacl,semantic,parquet,operational]" pillow

      - name: Lint (ruff, correctness rules from pyproject.toml)
        run: |
          python -m pip install "ruff==0.16.10"
          ruff check src tests extensions scripts library

      - name: Compile Python sources
        run: python -m compileall -q src extensions scripts library

      - name: Test core package
        run: python -m pytest -q tests

      - name: Test MCP intelligence bridge
        run: python -m pytest -q tests/test_intelligence_bridge.py

      - name: Test intelligence extension
        env:
          PYTHONPATH: extensions/intelligence_fabric
        run: python -m pytest -q extensions/intelligence_fabric/tests/test_intelligence_fabric.py

      - name: Test drawing-context safety contracts
        env:
          PYTHONPATH: extensions/drawing_context
        run: python -m pytest -q extensions/drawing_context/tests

      - name: Test external-capability contracts
        env:
          PYTHONPATH: extensions/external_capabilities
        run: python -m pytest -q extensions/external_capabilities/tests

  operational-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and start PostgreSQL (AGE + pgvector + PostGIS)
        run: |
          docker build -f docker/Dockerfile.db -t aec-postgres-age:ci docker
          docker run -d --name aec-db -e POSTGRES_DB=aec -e POSTGRES_USER=aec \
            -e POSTGRES_PASSWORD=ci -p 55432:5432 aec-postgres-age:ci
          for i in $(seq 1 60); do docker exec aec-db pg_isready -U aec -d aec && break; sleep 1; done

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,cad,bim,shacl,semantic,parquet,operational]"

      - name: Check database extensions (pgvector >= 0.7 for halfvec)
        run: |
          docker exec aec-db psql -U aec -d aec -c "CREATE EXTENSION IF NOT EXISTS vector" \
            -tAc "SELECT extversion FROM pg_extension WHERE extname='vector'"

      - name: Full test suite against PostgreSQL (no DB test may be skipped)
        # Explicit bash = 'bash -eo pipefail': without it a failing pytest is hidden by '| tee'.
        shell: bash
        env:
          AEC_TEST_DATABASE_URL: postgresql://aec:ci@localhost:55432/aec
        run: |
          python -m pytest -q -rs tests | tee pytest.log
          if grep -E "SKIPPED.*AEC_TEST_DATABASE_URL" pytest.log; then
            echo "::error::database tests were skipped although AEC_TEST_DATABASE_URL is set"; exit 1
          fi

      - name: End-to-end smoke run (CLI, MCP stdio/HTTP, worker, knowledge pack, REST API)
        run: |
          docker exec aec-db psql -U aec -d aec -c "CREATE DATABASE aec_e2e"
          docker exec aec-db psql -U aec -d aec_e2e -f /docker-entrypoint-initdb.d/10-init-extensions.sql
          python scripts/e2e/e2e_smoke.py --dsn postgresql://aec:ci@localhost:55432/aec_e2e --report e2e-report.json

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e-report.json
          if-no-files-found: ignore

  app-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build the api/worker image (deps from pyproject extras)
        run: |
          # A decoy .env must never reach the image (.dockerignore).
          echo "AEC_API_TOKEN=ci-decoy-not-a-secret" > .env
          mkdir -p logs && echo "decoy private log" > logs/decoy.log
          docker build -f docker/Dockerfile.app -t aec-intelligence-app:ci .
          rm -r .env logs

      - name: Image hygiene (no .env/.git/.venv/logs, non-root)
        run: |
          docker run --rm aec-intelligence-app:ci sh -c 'test ! -e /app/.env && test ! -e /app/.git && test ! -e /app/.venv && test ! -e /app/logs && test "$(id -u)" != 0 && echo hygiene-ok'

      - name: Smoke-test the image
        run: |
          docker run --rm aec-intelligence-app:ci python -c "import aec_intelligence.operational.api, ezdxf, fitz, psycopg; print('ok')"
          docker run --rm aec-intelligence-app:ci python -m aec_intelligence.operational.cli --help
