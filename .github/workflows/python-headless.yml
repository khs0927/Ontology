name: Shared Python headless validation
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: '3.12'
      validation-script:
        type: string
        required: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ inputs.python-version }}
      - name: Run caller-owned validation
        env:
          VALIDATION_SCRIPT: ${{ inputs.validation-script }}
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys
          root = pathlib.Path.cwd().resolve()
          script = (root / os.environ["VALIDATION_SCRIPT"]).resolve()
          if not script.is_relative_to(root / "scripts" / "ci") or script.suffix != ".py" or not script.is_file():
              sys.exit("validation-script must be an existing scripts/ci/*.py file inside caller checkout")
          subprocess.run([sys.executable, str(script)], check=True)
          PY
