name: Drawing context headless regressions

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - "extensions/drawing_context/**"
      - "scripts/verify_source_mapping.py"
      - "scripts/compare_rag_results.py"
      - ".github/workflows/drawing-context-headless.yml"

permissions:
  contents: read

jobs:
  contracts:
    name: contracts-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runtime
        run: python -m pip install pytest

      - name: Compile portable drawing-context code
        run: >-
          python -m compileall -q
          extensions/drawing_context
          scripts/verify_source_mapping.py
          scripts/compare_rag_results.py

      - name: Run drawing-context contracts
        env:
          PYTHONPATH: extensions/drawing_context
        run: python -m pytest -q extensions/drawing_context/tests
