name: Secondary census contract
on:
  pull_request:
    branches: [master]
    paths:
      - src/aec_intelligence/secondary_census.py
      - tests/test_secondary_census.py
      - .github/workflows/secondary-census.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_secondary_census.py
      - run: echo 'ACadSharp DWG invocation NOT_RUN; synthetic comparison contract only'
