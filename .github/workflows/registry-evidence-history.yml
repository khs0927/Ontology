name: Registry evidence history
on:
  pull_request:
    branches: [master]
    paths:
      - 'extensions/external_capabilities/**'
      - '.github/workflows/registry-evidence-history.yml'
permissions:
  contents: read
jobs:
  history:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q extensions/external_capabilities/tests
        env:
          PYTHONPATH: extensions/external_capabilities
